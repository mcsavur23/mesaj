allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// flutter_blue_plus ve cryptography_flutter gibi kütüphanelerin
// android.flutter.compileSdkVersion property'sini aramasına yönelik çözüm.
// configureEach: afterEvaluate'in neden olduğu "already evaluated" hatasını önler.
class FlutterExtension {
    int compileSdkVersion = 36
    int minSdkVersion = 23
    int targetSdkVersion = 36
}

subprojects {
    plugins.whenPluginAdded { plugin ->
        if (plugin.class.name.contains("com.android.build.gradle.LibraryPlugin")) {
            def androidExt = project.extensions.findByName("android")
            if (androidExt != null && !androidExt.extensions.findByName("flutter")) {
                androidExt.extensions.create("flutter", FlutterExtension)
            }
            project.android.compileSdkVersion 36
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
